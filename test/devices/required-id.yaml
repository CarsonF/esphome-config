esphome:
  name: required-id
esp32:
  board: esp32dev
  framework:
    type: esp-idf
uart:
  id: my_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 2400
  parity: EVEN
mitsubishi_cn105:
  id: my_mitsubishi_cn105
  uart_id: my_uart
interval:
  - interval: 1min
    then:
      - mitsubishi_cn105.set_remote_temperature:
          id: my_mitsubishi_cn105
          temperature: 21
