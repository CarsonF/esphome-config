esphome:
  name: demo-fan
esp32:
  board: esp32dev
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
api: {}
ota:
  - platform: esphome
logger:
  level: INFO
globals:
  - id: too_hot
    type: bool
    initial_value: 'false'
output:
  - platform: ledc
    id: cooler_output
    pin: GPIO5
fan:
  - platform: speed
    id: cooler_fan
    name: Cooler
    output: cooler_output
sensor:
  - platform: adc
    name: Temperature
    pin: GPIO34
    update_interval: 10s
    on_value:
      then:
        - globals.set:
            id: too_hot
            value: !lambda return x > 30.0;
        - fan.turn_on: cooler_fan
        - logger.log:
            tag: fan
            level: INFO
            format: 'too hot: %d'
            args:
              - id(too_hot)
