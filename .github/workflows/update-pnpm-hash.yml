name: Update pnpm hash

on:
  pull_request:
    paths: [pnpm-lock.yaml]

permissions:
  actions: write
  contents: write

jobs:
  update:
    # fork PRs get a read-only token, so they cannot be pushed to
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: scripts/update-pnpm-hash.sh
      - name: Commit the new hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet nix/pnpm-deps.hash && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update pnpm dependency hash' nix/pnpm-deps.hash
          git push
          # pushes made with GITHUB_TOKEN do not trigger CI, but workflow_dispatch runs do
          gh workflow run ci.yml --ref "$GITHUB_HEAD_REF"
