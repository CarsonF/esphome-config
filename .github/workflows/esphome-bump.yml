name: ESPHome bump

# opens a PR moving the types to the ESPHome of the latest nixpkgs; it never merges one
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Bump
        id: bump
        run: scripts/bump-esphome.sh
      - name: Skip a version that has a branch
        id: branch
        if: steps.bump.outputs.status == 'bumped'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # its PR is open, or was closed: either way, nothing to do
          if git ls-remote --exit-code origin "refs/heads/esphome/$VERSION" >/dev/null; then
            echo "::notice::esphome/$VERSION exists already"
            echo "exists=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Check
        id: check
        if: steps.bump.outputs.status == 'bumped' && steps.branch.outputs.exists != 'true'
        continue-on-error: true
        run: nix flake check --print-build-logs
      - name: Open the PR
        if: steps.bump.outputs.status == 'bumped' && steps.branch.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_AS: ${{ steps.bump.outputs.release_as }}
          CHECKED: ${{ steps.check.outcome }}
        run: |
          branch="esphome/$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          {
            echo "feat: types for ESPHome $VERSION"
            if [[ -n $RELEASE_AS ]]; then
              echo
              echo "Release-As: $RELEASE_AS"
            fi
          } >"$RUNNER_TEMP/message"
          git commit -F "$RUNNER_TEMP/message"
          git push origin "$branch"

          {
            echo "Moves the types and flake.lock to ESPHome $VERSION, the version nixpkgs has."
            if [[ -n $RELEASE_AS ]]; then echo "Merging it releases $RELEASE_AS."; fi
            echo
            if [[ $CHECKED == success ]]; then
              echo "\`nix flake check\` passed."
            else
              echo "\`nix flake check\` failed: see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            fi
          } >"$RUNNER_TEMP/body"
          draft=$([[ $CHECKED == success ]] || echo --draft)
          gh pr create --head "$branch" --title "feat: types for ESPHome $VERSION" \
            --body-file "$RUNNER_TEMP/body" $draft
          # PRs opened with GITHUB_TOKEN do not trigger CI, but workflow_dispatch runs do
          gh workflow run ci.yml --ref "$branch"
