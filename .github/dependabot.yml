version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # types follow the oldest supported Node (engines >=24)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # cpp() parses TypeScript with the JS compiler API, which typescript@7 does not export
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # esphome.io's docs script imports these, at the versions its lockfile pins
      - dependency-name: unified
      - dependency-name: remark-parse
      - dependency-name: remark-mdx
      - dependency-name: remark-math
      - dependency-name: mdast-util-to-string
      - dependency-name: github-slugger
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
